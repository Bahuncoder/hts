name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    name: Python engine and classifier tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # These need no downloaded data. test_api, test_refresh and the
      # classifier evaluation need the reference data in data/ and run on the
      # release machine (`make check`).
      - run: python3 tests/test_duty.py
      - run: python3 tests/test_classify_eval.py

  web:
    name: Web type-check, lint, build and integration tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx eslint src
      - run: npm audit --audit-level=high
      # Builds the production bundle, then drives the real routes against a
      # scratch database and fake engine/mail servers.
      - run: npm run test:integration
