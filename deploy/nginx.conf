# Front for the API.
#
# The Next.js app proxies audit traffic server-side, so browsers never call
# this origin directly and no CORS headers are needed here. Keep
# HTSDESK_ORIGINS empty unless a third party genuinely needs browser access.

# Edge rate limiting. The application also limits per client, in a small SQLite
# database shared by every worker (api/security.py), and the web app meters the
# work each caller may submit (web/src/lib/budget.ts). This is the outermost
# layer: it bounds raw request volume before either of them is reached, and it
# is the only limit that also covers traffic carrying a valid engine key.
limit_req_zone $binary_remote_addr zone=tw_api:10m  rate=120r/m;
limit_req_zone $binary_remote_addr zone=tw_heavy:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=tw_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A catalogue of 1000 items is roughly 100 KB; refuse anything absurd
    # before it reaches the application.
    client_max_body_size 2m;
    limit_conn tw_conn 20;

    # Classification is CPU-bound and the reasoning layer calls out to an LLM.
    proxy_read_timeout 120s;

    location / {
        limit_req zone=tw_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints that run classifications are metered far more tightly: each
    # item costs ~175 ms of CPU.
    location ~ ^/api/(audit|classify) {
        limit_req zone=tw_heavy burst=5 nodelay;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
